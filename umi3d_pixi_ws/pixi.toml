[workspace]
name = "umi_3d_slam_ws"
channels = ["https://prefix.dev/robostack-noetic", "https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Base ROS dependencies
ros-noetic-ros-base = "*"
pkg-config = "*"
compilers = "*"
make = "*"
ninja = "*"

# Build tools
colcon-common-extensions = "*"
cmake = "<4"
empy = "==3.3.4"

# Workspace dependencies
apr = "*"
git = "*"
ros-noetic-catkin = "*"
ros-noetic-cmake-modules = "*"
ros-noetic-cv-bridge = "*"
ros-noetic-eigen-conversions = "*"
ros-noetic-geometry-msgs = "*"
ros-noetic-image-transport = "*"
ros-noetic-message-generation = "*"
ros-noetic-message-runtime = "*"
ros-noetic-nav-msgs = "*"
ros-noetic-pcl-ros = "*"
ros-noetic-rosbag = "*"
ros-noetic-roscpp = "*"
ros-noetic-rospy = "*"
ros-noetic-rostest = "*"
ros-noetic-rviz = "*"
ros-noetic-compressed-image-transport = "*"
ros-noetic-topic-tools = "*"
ros-noetic-sensor-msgs = "*"
ros-noetic-std-msgs = "*"
ros-noetic-tf = "*"
ros-noetic-visualization-msgs = "*"

[tasks]
build = {cmd = "catkin_make -DSophus_DIR=/home/nuc/fyp/deps/Sophus/build-pixi", description = "Build the ROS workspace"}

# Scripts to source on environment activation, found after first colcon build.

[activation]
scripts = ["devel/setup.bash"]
